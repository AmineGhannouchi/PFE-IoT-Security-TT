# PFE IoT Security TT — Wazuh Single-Node
# Déploiement : Docker dans GNS3 (zone SIEM 192.168.40.0/24)
# Compatibilité : Wazuh 4.9.x | OpenSearch 2.x
# RAM optimisée : 32 Go RAM disponible

services:

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword1!
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr3tP@ssw0rd
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      # Certificats Wazuh internes (filebeat vers indexer)
      - ./wazuh-certs/root-ca.pem:/etc/ssl/root-ca.pem
      - ./wazuh-certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh-certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      # Configuration custom
      - ./wazuh-config/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./wazuh-config/rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml
      # Logs Suricata (chemin Linux sur le host GNS3)
      - /opt/pfe/results/suricata/eve.json:/var/ossec/logs/suricata/eve.json:ro
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      pfe-siem-network:
        ipv4_address: 192.168.40.10

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    hostname: wazuh.indexer
    restart: always
    environment:
      # 32 Go RAM dispo : heap indexer à 2 Go
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - node.name=wazuh.indexer
      - cluster.initial_cluster_manager_nodes=wazuh.indexer
      - discovery.type=single-node
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh-certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh-certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh-certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh-certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh-config/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh-config/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    networks:
      pfe-siem-network:
        ipv4_address: 192.168.40.20

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    hostname: wazuh.dashboard
    restart: always
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword1!
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr3tP@ssw0rd
    volumes:
      - ./wazuh-certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh-certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.key
      - ./wazuh-certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh-config/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
    ports:
      - "443:5601"
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      pfe-siem-network:
        ipv4_address: 192.168.40.30

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:

networks:
  # Réseau déjà créé dans GNS3 — on l'utilise tel quel
  pfe-siem-network:
    external: true
    ipam:
      config:
        - subnet: 172.20.0.0/24