# ============================================================
# PFE IoT Security TT — OpenSearch Dashboards config
# Node: wazuh.dashboard | IP: 192.168.40.30
# ============================================================

server.host: 0.0.0.0
server.port: 5601

# ---- Connexion à l'indexer ----
opensearch.hosts: https://wazuh.indexer:9200
opensearch.ssl.verificationMode: certificate
opensearch.username: kibanaserver
opensearch.password: kibanaserver
opensearch.requestHeadersAllowlist: ["securitytenant", "Authorization"]

# ---- TLS Dashboard ----
server.ssl.enabled: true
server.ssl.key: /usr/share/wazuh-dashboard/certs/wazuh-dashboard.key
server.ssl.certificate: /usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
opensearch.ssl.certificateAuthorities:
  - /usr/share/wazuh-dashboard/certs/root-ca.pem

# ---- Sécurité ----
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles:
  - kibana_read_only
opensearch_security.cookie.secure: false

# ---- Wazuh App ----
uiSettings.overrides.defaultRoute: /app/wazuh
